<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="100%" viewBox="0 0 520 650" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Tahoma, Arial, sans-serif">
<title>القلب والرئتان</title>
<desc>رسم توضيحي أصلي من منظور أمامي يعرض الرئتين والقلب المتداخل بينهما والأوعية الدموية المتفرعة من الأعلى</desc>

<defs>
<marker id="arrowGas" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L5 9L9 1" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<linearGradient id="lungGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#E3C39A"/>
<stop offset="100%" stop-color="#C9A06E"/>
</linearGradient>
<linearGradient id="heartGrad2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#D14B4B"/>
<stop offset="100%" stop-color="#9A2A2A"/>
</linearGradient>
<style><![CDATA[
@keyframes heartBeat2 {
  0%   { transform: scale(1); }
  12%  { transform: scale(1.15); }
  24%  { transform: scale(1); }
  34%  { transform: scale(1.08); }
  44%  { transform: scale(1); }
  100% { transform: scale(1); }
}
#heartFront{transform-box:fill-box;transform-origin:center;animation:heartBeat2 1s ease-in-out infinite}
@keyframes lungsBreathe2 { 0%,100%{transform:scale(1)} 50%{transform:scale(1.045)} }
#lungsFront{transform-box:fill-box;transform-origin:center;animation:lungsBreathe2 3s ease-in-out infinite}
@keyframes vesselPulse { 0%,100%{opacity:0.85} 50%{opacity:1} }
#vesselsFront{animation:vesselPulse 1s ease-in-out infinite}
@keyframes alveoliPulse { 0%,100%{opacity:0.35;transform:scale(1)} 50%{opacity:0.75;transform:scale(1.3)} }
#alveoliDots circle{animation:alveoliPulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#alveoliDots circle:nth-child(odd){animation-delay:.5s}
@keyframes o2Move { 0%{transform:translateY(0);opacity:0} 20%{opacity:1} 75%{opacity:1} 100%{transform:translateY(70px);opacity:0} }
@keyframes co2Move { 0%{transform:translateY(70px);opacity:0} 20%{opacity:1} 75%{opacity:1} 100%{transform:translateY(0);opacity:0} }
.gasParticle{animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes flowMove2 { 0%{transform:translate(0,0);opacity:0} 15%{opacity:1} 80%{opacity:1} 100%{transform:translate(var(--dx),var(--dy));opacity:0} }
.flowParticle{animation-name:flowMove2;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes badgePulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
#pulmArteryFront,#pulmVeinFront,#descAortaFront{animation:badgePulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes arrowO2Fade { 0%{opacity:0} 10%{opacity:1} 40%{opacity:1} 50%{opacity:0} 100%{opacity:0} }
@keyframes arrowCO2Fade { 0%{opacity:0} 50%{opacity:0} 60%{opacity:1} 90%{opacity:1} 100%{opacity:0} }
#arrowO2InG{animation:arrowO2Fade 2.6s linear infinite}
#arrowCO2OutG{animation:arrowCO2Fade 2.6s linear infinite}
.lbl{cursor:pointer}
text{font-family:Tahoma, Arial, sans-serif}
]]></style>
</defs>

<rect x="0" y="0" width="520" height="650" fill="#FAFAF7"/>
<rect x="150" y="8" width="220" height="36" rx="18" fill="#7A3FA0"/>
<text x="260" y="31" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFFFFF">القلب والرئتان</text>

<!-- الرئتان (منظور أمامي) -->
<g id="lungsFront" class="lbl" onclick="sendPrompt('اشرح لي شكل الرئتين من المنظور الأمامي ولماذا الرئة اليسرى أصغر')">
<!-- الرئة اليمنى (يسار الصورة) -->
<path d="M245 165 C 200 150, 150 160, 125 210 C 100 260, 95 340, 105 420 C 112 470, 130 505, 160 515 C 190 522, 215 505, 225 470 L 235 250 Z" fill="url(#lungGrad)" stroke="#8A6A45" stroke-width="1.5"/>
<!-- الرئة اليسرى (يمين الصورة، أصغر قليلًا بسبب مكان القلب) -->
<path d="M275 165 C 320 150, 372 162, 395 212 C 418 262, 420 340, 408 415 C 400 465, 380 500, 350 510 C 320 518, 297 500, 288 468 L 280 250 Z" fill="url(#lungGrad)" stroke="#8A6A45" stroke-width="1.5"/>
<!-- خطوط الفصوص -->
<g stroke="#8A6A45" stroke-width="1" opacity="0.55" fill="none">
<path d="M140 260 C 165 275, 190 275, 220 265"/>
<path d="M125 340 C 155 355, 190 355, 220 345"/>
<path d="M300 260 C 330 275, 360 272, 385 258"/>
<path d="M295 350 C 325 365, 360 362, 395 345"/>
</g>
<!-- حويصلات هوائية (نقاط تبادل الغازات) -->
<g id="alveoliDots" fill="#B5352F" opacity="0.35">
<circle cx="150" cy="260" r="3"/><circle cx="175" cy="290" r="3"/><circle cx="140" cy="320" r="3"/>
<circle cx="165" cy="350" r="3"/><circle cx="185" cy="380" r="3"/><circle cx="150" cy="400" r="3"/>
<circle cx="370" cy="260" r="3"/><circle cx="345" cy="290" r="3"/><circle cx="380" cy="320" r="3"/>
<circle cx="355" cy="350" r="3"/><circle cx="335" cy="380" r="3"/><circle cx="370" cy="400" r="3"/>
</g>
</g>

<!-- القصبة الهوائية وتفرعها لشعبتين هوائيتين -->
<g id="tracheaFront2" class="lbl" onclick="sendPrompt('اشرح لي القصبة الهوائية وكيف تتفرع لشعبتين تدخلان الرئتين')">
<path d="M245 48 L245 200" fill="none" stroke="#CDE4EF" stroke-width="13" stroke-linecap="round"/>
<path d="M245 48 L245 200" fill="none" stroke="#5E9BB8" stroke-width="1.2"/>
<g stroke="#5E9BB8" stroke-width="1" opacity="0.7">
<line x1="239" y1="60" x2="251" y2="60"/><line x1="239" y1="76" x2="251" y2="76"/>
<line x1="239" y1="92" x2="251" y2="92"/><line x1="239" y1="108" x2="251" y2="108"/>
<line x1="239" y1="124" x2="251" y2="124"/><line x1="239" y1="140" x2="251" y2="140"/>
<line x1="239" y1="156" x2="251" y2="156"/><line x1="239" y1="174" x2="251" y2="174"/>
</g>
<path d="M245 200 C 225 212, 200 222, 180 240" fill="none" stroke="#CDE4EF" stroke-width="8" stroke-linecap="round"/>
<path d="M245 200 C 225 212, 200 222, 180 240" fill="none" stroke="#5E9BB8" stroke-width="1"/>
<path d="M245 200 C 270 212, 305 222, 340 240" fill="none" stroke="#CDE4EF" stroke-width="8" stroke-linecap="round"/>
<path d="M245 200 C 270 212, 305 222, 340 240" fill="none" stroke="#5E9BB8" stroke-width="1"/>
</g>
<line x1="245" y1="100" x2="120" y2="90" stroke="#4A4A45" stroke-width="0.7"/>
<text x="115" y="94" font-size="15" font-weight="bold" text-anchor="end" fill="#2A6E8A">القصبة الهوائية</text>

<!-- أسهم اتجاه دخول وخروج الأكسجين عند القصبة -->
<g id="arrowO2InG">
<path d="M232 60 L232 82" stroke="#3D6FBF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowGas)"/>
</g>
<g id="arrowCO2OutG">
<path d="M258 82 L258 60" stroke="#8A7A5C" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowGas)"/>
</g>


<!-- جزيئات الأكسجين الداخلة وثاني أكسيد الكربون الخارجة -->
<g id="o2InParticles"></g>
<g id="co2OutParticles"></g>
<text id="gasLabel2" x="260" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#2A6E8A">O2 يدخل ⬇</text>



<!-- الأوعية الدموية (متفرعة من أعلى القلب) -->
<g id="vesselsFront" class="lbl" onclick="sendPrompt('اشرح لي الأوعية الدموية الكبرى المتصلة بالقلب')">
<path d="M260 195 C 258 160, 258 130, 258 105" fill="none" stroke="#B5352F" stroke-width="9" stroke-linecap="round"/>
<path d="M258 130 C 235 115, 215 100, 200 80" fill="none" stroke="#B5352F" stroke-width="7" stroke-linecap="round"/>
<path d="M258 120 C 275 100, 290 85, 300 65" fill="none" stroke="#3D6FBF" stroke-width="7" stroke-linecap="round"/>
<path d="M270 195 C 285 170, 300 150, 305 125" fill="none" stroke="#3D6FBF" stroke-width="8" stroke-linecap="round"/>
</g>

<!-- ٢) الشريان الرئوي: يرسل الدم للرئتين ليأخذ الأكسجين -->
<g id="pulmArteryFront" class="lbl" onclick="sendPrompt('اشرح لي كيف يرسل القلب الدم للرئتين ليحصل على الأكسجين')">
<path d="M300 235 C 325 245, 350 255, 368 268" fill="none" stroke="#3D6FBF" stroke-width="7" stroke-linecap="round"/>
</g>
<g id="pulmArteryParticles"></g>

<!-- ٣) الوريد الرئوي: يستقبل الدم الغني بالأكسجين من الرئتين -->
<g id="pulmVeinFront" class="lbl" onclick="sendPrompt('اشرح لي كيف يستقبل القلب الدم الغني بالأكسجين من الرئتين')">
<path d="M220 235 C 195 248, 170 260, 152 275" fill="none" stroke="#B5352F" stroke-width="7" stroke-linecap="round"/>
</g>
<g id="pulmVeinParticles"></g>

<!-- ١) الأبهر النازل: يضخ الدم لكل أجزاء الجسم -->
<g id="descAortaFront" class="lbl" onclick="sendPrompt('اشرح لي كيف يضخ القلب الدم لكل أجزاء الجسم عبر الأبهر')">
<path d="M260 318 L260 470" fill="none" stroke="#B5352F" stroke-width="10" stroke-linecap="round"/>
</g>
<g id="descAortaParticles"></g>

<!-- القلب (متداخل بين الرئتين) -->
<g id="heartFront" class="lbl" onclick="sendPrompt('اشرح لي موقع القلب بين الرئتين ولماذا يميل لليسار')">
<path d="M260 210 C 240 175, 195 178, 190 215 C 187 250, 220 280, 260 320 C 300 280, 333 250, 330 215 C 325 178, 280 175, 260 210 Z" fill="url(#heartGrad2)" stroke="#6E1F1F" stroke-width="1.5"/>
</g>

<!-- خطوط التسمية -->
<line x1="255" y1="230" x2="150" y2="140" stroke="#4A4A45" stroke-width="0.7"/>
<text x="145" y="135" font-size="16" font-weight="bold" text-anchor="end" fill="#2A2A28">القلب</text>

<line x1="290" y1="110" x2="400" y2="140" stroke="#4A4A45" stroke-width="0.7"/>
<text x="405" y="136" font-size="16" font-weight="bold" text-anchor="start" fill="#2A2A28">الأوعية</text>
<text x="405" y="156" font-size="16" font-weight="bold" text-anchor="start" fill="#2A2A28">الدموية</text>

<!-- بطاقات الوظائف الثلاث -->
<g>
<circle cx="42" cy="270" r="13" fill="#B5352F"/>
<text x="42" y="275" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">١</text>
<text x="62" y="266" font-size="12" font-weight="bold" text-anchor="start" fill="#7A2020">يضخ الدم إلى</text>
<text x="62" y="282" font-size="12" font-weight="bold" text-anchor="start" fill="#7A2020">جميع أجزاء الجسم</text>
</g>
<line x1="255" y1="400" x2="130" y2="272" stroke="#B5352F" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.6"/>

<g>
<circle cx="42" cy="330" r="13" fill="#3D6FBF"/>
<text x="42" y="335" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">٢</text>
<text x="62" y="326" font-size="12" font-weight="bold" text-anchor="start" fill="#1F4A80">يرسل الدم للرئتين</text>
<text x="62" y="342" font-size="12" font-weight="bold" text-anchor="start" fill="#1F4A80">ليحصل على الأكسجين</text>
</g>
<line x1="330" y1="255" x2="130" y2="332" stroke="#3D6FBF" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.6"/>

<g>
<circle cx="42" cy="390" r="13" fill="#8A2F2F"/>
<text x="42" y="395" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">٣</text>
<text x="62" y="386" font-size="12" font-weight="bold" text-anchor="start" fill="#7A2020">يستقبل دمًا غنيًا</text>
<text x="62" y="402" font-size="12" font-weight="bold" text-anchor="start" fill="#7A2020">بالأكسجين ويرسله للجسم</text>
</g>
<line x1="180" y1="255" x2="130" y2="392" stroke="#8A2F2F" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.6"/>


<line x1="255" y1="490" x2="255" y2="560" stroke="#4A4A45" stroke-width="0.7"/>
<line x1="255" y1="560" x2="200" y2="560" stroke="#4A4A45" stroke-width="0.7"/>
<line x1="255" y1="490" x2="255" y2="560" stroke="#4A4A45" stroke-width="0.7"/>
<line x1="330" y1="490" x2="330" y2="560" stroke="#4A4A45" stroke-width="0.7"/>
<text x="265" y="580" font-size="16" font-weight="bold" text-anchor="middle" fill="#2A2A28">الرئتان</text>

<rect x="30" y="600" width="460" height="34" rx="8" fill="#F0EDE3" stroke="#D8D3C4" stroke-width="1"/>
<text x="260" y="622" font-size="13" text-anchor="middle" fill="#5F5E5A">✅ اختبر نفسي: أين يقع القلب بالضبط بين الرئتين؟ ولماذا؟</text>

<text x="260" y="645" text-anchor="middle" font-size="10" fill="#8A8880">رسم توضيحي أصلي لمشروع «المعلمة الذكية» — لا يعتمد على أي مصدر خارجي</text>

<script><![CDATA[
function makeGasParticles(){
  const o2c = document.getElementById('o2InParticles');
  const co2c = document.getElementById('co2OutParticles');
  o2c.innerHTML = ''; co2c.innerHTML = '';
  const spots = [[150,240],[380,240],[130,340],[400,340],[170,400],[350,400]];
  spots.forEach((p,i)=>{
    const o2 = document.createElementNS('http://www.w3.org/2000/svg','circle');
    o2.setAttribute('cx', p[0]); o2.setAttribute('cy', p[1]-20);
    o2.setAttribute('r', 3.5); o2.setAttribute('fill', '#3D6FBF');
    o2.setAttribute('class','gasParticle');
    o2.style.animation = 'o2Move 2.6s linear infinite';
    o2.style.animationDelay = (i*0.3)+'s';
    o2c.appendChild(o2);

    const co2 = document.createElementNS('http://www.w3.org/2000/svg','circle');
    co2.setAttribute('cx', p[0]+10); co2.setAttribute('cy', p[1]-20);
    co2.setAttribute('r', 3.5); co2.setAttribute('fill', '#8A7A5C');
    co2.setAttribute('class','gasParticle');
    co2.style.animation = 'co2Move 2.6s linear infinite';
    co2.style.animationDelay = (i*0.3 + 0.4)+'s';
    co2c.appendChild(co2);
  });
}

let gasInhale = true;
function toggleGasLabel(){
  gasInhale = !gasInhale;
  document.getElementById('gasLabel2').textContent = gasInhale ? 'O2 يدخل ⬇' : 'CO2 يخرج ⬆';
}
setInterval(toggleGasLabel, 1300);

function makeFunctionFlows(){
  const specs = [
    {id:'pulmArteryParticles', x:300, y:235, dx:60, dy:28, color:'#3D6FBF', dur:1.4},
    {id:'pulmVeinParticles', x:152, y:275, dx:68, dy:-40, color:'#B5352F', dur:1.4},
    {id:'descAortaParticles', x:260, y:322, dx:0, dy:135, color:'#B5352F', dur:1.6}
  ];
  specs.forEach(s=>{
    const c = document.getElementById(s.id);
    c.innerHTML = '';
    for(let i=0;i<2;i++){
      const p = document.createElementNS('http://www.w3.org/2000/svg','circle');
      p.setAttribute('cx', s.x); p.setAttribute('cy', s.y);
      p.setAttribute('r', 3.5); p.setAttribute('fill', s.color);
      p.setAttribute('class','flowParticle');
      p.style.setProperty('--dx', s.dx+'px');
      p.style.setProperty('--dy', s.dy+'px');
      p.style.animationDuration = s.dur+'s';
      p.style.animationDelay = (i*s.dur/2)+'s';
      c.appendChild(p);
    }
  });
}

makeGasParticles();
makeFunctionFlows();
]]></script>
</svg>
