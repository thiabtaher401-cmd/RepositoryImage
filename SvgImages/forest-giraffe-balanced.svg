<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">

  <title>زرافة تمشي في غابة — مشهد كامل متوازن</title>
  <desc>مشهد غابة كامل (سماء + أشجار + أرض) مع زرافة تمشي بهدوء في المنتصف. viewBox مربّع متوازن (400×400) بحيث يملأ المحتوى الإطار بالكامل رأسيًا وأفقيًا بدون فراغ، على عكس المشاهد العريضة التقليدية (1920×1080).</desc>

  <defs>
    <linearGradient id="sceneSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0d2b1a"/>
      <stop offset="55%" stop-color="#1f4a2c"/>
      <stop offset="100%" stop-color="#3a6b3f"/>
    </linearGradient>
  </defs>

  <style>
    /* ===== تمايل الأشجار (حركة رياح لطيفة) ===== */
    .sway {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: treeSway 4s ease-in-out infinite;
    }
    .sway.b { animation-delay: 0.7s; }
    .sway.c { animation-delay: 1.4s; }
    .sway.d { animation-delay: 2.1s; }
    @keyframes treeSway {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(2.2deg); }
    }

    /* ===== مشي الزرافة (تمايل خفيف للجسم + الرقبة) ===== */
    #giraffeWalk {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: giraffeBob 1.4s ease-in-out infinite;
    }
    @keyframes giraffeBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-4px) rotate(-1.2deg); }
    }

    /* ===== أشعة شمس متلألئة خفيفة ===== */
    .ray {
      animation: rayGlow 3.5s ease-in-out infinite;
    }
    .ray.b { animation-delay: 1.1s; }
    .ray.c { animation-delay: 2.2s; }
    @keyframes rayGlow {
      0%, 100% { opacity: 0.12; }
      50%      { opacity: 0.30; }
    }
  </style>

  <!-- ⭐ المشهد كاملًا (خلفية + زرافة) داخل مجموعة واحدة —
       المحتوى يمتد من قمة الإطار (السماء/الأشجار) حتى قاعدته
       (الأرض)، فلا يوجد فراغ فارغ أعلى أو أسفل عند القصّ والتمدد -->
  <g id="characterPlacement">

    <!-- ===== السماء (تملأ من القمة) ===== -->
    <rect x="0" y="0" width="400" height="400" fill="url(#sceneSky)"/>

    <!-- ===== أشعة شمس متسللة (تصل قمة الإطار) ===== -->
    <polygon class="ray a"   points="60,0 100,0 40,220 10,220"  fill="#fff4c2"/>
    <polygon class="ray b"   points="180,0 215,0 165,240 135,240" fill="#fff4c2"/>
    <polygon class="ray c"   points="300,0 335,0 300,230 270,230" fill="#fff4c2"/>

    <!-- ===== الأرض (تصل قاعدة الإطار) ===== -->
    <rect x="0" y="300" width="400" height="100" fill="#2d4a24"/>
    <path d="M 0 300 Q 200 288 400 300 L 400 310 Q 200 298 0 310 Z" fill="#3a5c30"/>

    <!-- ===== أشجار خلفية (يسار) ===== -->
    <g class="sway a">
      <rect x="24" y="150" width="10" height="160" fill="#3b2a1d"/>
      <ellipse cx="29" cy="110" rx="34" ry="55" fill="#1e5b34"/>
      <ellipse cx="12" cy="140" rx="24" ry="38" fill="#256a3d"/>
    </g>
    <g class="sway c">
      <rect x="66" y="175" width="8" height="135" fill="#3b2a1d"/>
      <ellipse cx="70" cy="140" rx="26" ry="42" fill="#1e5b34"/>
    </g>

    <!-- ===== أشجار خلفية (يمين) ===== -->
    <g class="sway b">
      <rect x="366" y="150" width="10" height="160" fill="#3b2a1d"/>
      <ellipse cx="371" cy="110" rx="34" ry="55" fill="#1e5b34"/>
      <ellipse cx="388" cy="140" rx="24" ry="38" fill="#256a3d"/>
    </g>
    <g class="sway d">
      <rect x="326" y="175" width="8" height="135" fill="#3b2a1d"/>
      <ellipse cx="330" cy="140" rx="26" ry="42" fill="#1e5b34"/>
    </g>

    <!-- ظل خفيف تحت الزرافة -->
    <ellipse cx="200" cy="322" rx="70" ry="14" fill="#000000" opacity="0.18"/>

    <!-- ===== الزرافة (تمشي في المنتصف) ===== -->
    <g id="giraffeWalk">

      <!-- الأرجل -->
      <rect x="160" y="255" width="14" height="65" rx="6" fill="#d9a95c"/>
      <rect x="185" y="255" width="14" height="65" rx="6" fill="#c8934a"/>
      <rect x="212" y="255" width="14" height="65" rx="6" fill="#d9a95c"/>
      <rect x="237" y="255" width="14" height="65" rx="6" fill="#c8934a"/>
      <!-- حوافر -->
      <rect x="158" y="312" width="18" height="10" rx="3" fill="#4a3220"/>
      <rect x="183" y="312" width="18" height="10" rx="3" fill="#4a3220"/>
      <rect x="210" y="312" width="18" height="10" rx="3" fill="#4a3220"/>
      <rect x="235" y="312" width="18" height="10" rx="3" fill="#4a3220"/>

      <!-- الجسم -->
      <ellipse cx="205" cy="240" rx="80" ry="48" fill="#e0ab5f"/>

      <!-- الذيل -->
      <path d="M 285 225 Q 305 250 298 285" stroke="#c8934a" stroke-width="7"
            stroke-linecap="round" fill="none"/>

      <!-- الرقبة -->
      <path d="M 175 210 Q 155 130 168 65" stroke="#e0ab5f" stroke-width="42"
            stroke-linecap="round" fill="none"/>

      <!-- الرأس -->
      <ellipse cx="163" cy="55" rx="30" ry="24" fill="#e0ab5f"/>
      <!-- أذنان -->
      <ellipse cx="142" cy="38" rx="8" ry="14" fill="#d9a95c" transform="rotate(-25 142 38)"/>
      <ellipse cx="184" cy="38" rx="8" ry="14" fill="#d9a95c" transform="rotate(25 184 38)"/>
      <!-- قرنان صغيران -->
      <rect x="152" y="24" width="6" height="16" rx="3" fill="#8a6a3a"/>
      <rect x="170" y="24" width="6" height="16" rx="3" fill="#8a6a3a"/>
      <circle cx="155" cy="24" r="4" fill="#c8934a"/>
      <circle cx="173" cy="24" r="4" fill="#c8934a"/>

      <!-- عين وأنف -->
      <circle cx="150" cy="52" r="4.5" fill="#2a2a2a"/>
      <ellipse cx="140" cy="66" rx="6" ry="4" fill="#8a6a3a"/>

      <!-- بقع بنية على الجسم والرقبة -->
      <ellipse cx="180" cy="225" rx="14" ry="11" fill="#a9793f" opacity="0.85"/>
      <ellipse cx="220" cy="235" rx="16" ry="12" fill="#a9793f" opacity="0.85"/>
      <ellipse cx="250" cy="220" rx="12" ry="10" fill="#a9793f" opacity="0.85"/>
      <ellipse cx="200" cy="255" rx="12" ry="9" fill="#a9793f" opacity="0.85"/>
      <ellipse cx="168" cy="145" rx="10" ry="14" fill="#a9793f" opacity="0.85"/>
      <ellipse cx="163" cy="185" rx="11" ry="15" fill="#a9793f" opacity="0.85"/>

    </g>

  </g>

</svg>
