<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="700" height="260" viewBox="0 0 700 260">

<defs>
  <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffe6a8"/>
    <stop offset="60%" stop-color="#f4c96b"/>
    <stop offset="100%" stop-color="#d79b35"/>
  </linearGradient>

  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="3" dy="5" stdDeviation="4"
                  flood-color="#000000" flood-opacity="0.28"/>
  </filter>
</defs>

<style>
#walker{
 animation:walk 8s linear infinite;
}
#body{
 transform-origin:80px 130px;
 animation:bounce .55s ease-in-out infinite;
}
#head{
 transform-origin:77px 55px;
 animation:head .55s ease-in-out infinite;
}
#tail{
 transform-origin:122px 120px;
 animation:tail .55s ease-in-out infinite alternate;
}
.frontA,.backA{
 transform-origin:center top;
 animation:legA .55s ease-in-out infinite;
}
.frontB,.backB{
 transform-origin:center top;
 animation:legB .55s ease-in-out infinite;
}
#shadowEllipse{
 animation:shadowAnim .55s ease-in-out infinite;
}
@keyframes walk{
 from{transform:translateX(650px);}
 to{transform:translateX(-180px);}
}
@keyframes bounce{
 0%,100%{transform:translateY(0);}
 50%{transform:translateY(-4px);}
}
@keyframes head{
 0%,100%{transform:rotate(-2deg);}
 50%{transform:rotate(3deg);}
}
@keyframes tail{
 from{transform:rotate(-18deg);}
 to{transform:rotate(18deg);}
}
@keyframes legA{
 0%,100%{transform:rotate(18deg);}
 50%{transform:rotate(-18deg);}
}
@keyframes legB{
 0%,100%{transform:rotate(-18deg);}
 50%{transform:rotate(18deg);}
}
@keyframes shadowAnim{
 0%,100%{transform:scaleX(1);opacity:.22;}
 50%{transform:scaleX(.88);opacity:.12;}
}
</style>

<g id="walker">

<ellipse id="shadowEllipse"
         cx="82" cy="222"
         rx="58" ry="10"
         fill="#000" opacity=".2"/>

<g id="body" filter="url(#shadow)">

<ellipse cx="80" cy="130"
         rx="46" ry="30"
         fill="url(#bodyGrad)"
         stroke="#4d3518"
         stroke-width="2"/>

<ellipse cx="66" cy="118"
         rx="12" ry="6"
         fill="#fff"
         opacity=".25"/>

<path d="M60 113
         C67 104 77 103 84 112
         C78 120 67 121 60 113Z"
      fill="#c98b2e"/>

<path d="M95 132
         C104 122 114 123 118 133
         C110 141 101 142 95 132Z"
      fill="#c98b2e"/>

<path d="M50 145
         C58 137 66 138 69 146
         C61 154 53 154 50 145Z"
      fill="#c98b2e"/>

</g>

<rect x="68" y="48"
      width="18"
      height="72"
      rx="9"
      fill="url(#bodyGrad)"
      stroke="#4d3518"
      stroke-width="2"/>

<g id="head">

<circle cx="77"
        cy="34"
        r="20"
        fill="url(#bodyGrad)"
        stroke="#4d3518"
        stroke-width="2"/>

<ellipse cx="70"
         cy="27"
         rx="6"
         ry="3"
         fill="#fff"
         opacity=".35"/>

<circle cx="71" cy="32" r="2.4"/>
<circle cx="83" cy="32" r="2.4"/>

<line x1="70" y1="16" x2="68" y2="5"
      stroke="#6b3f18" stroke-width="3"/>

<line x1="84" y1="16" x2="86" y2="5"
      stroke="#6b3f18" stroke-width="3"/>

<circle cx="68" cy="5" r="3" fill="#8b5a2b"/>
<circle cx="86" cy="5" r="3" fill="#8b5a2b"/>

<path d="M73 41 Q77 44 81 41"
      stroke="#6b3f18"
      stroke-width="1.5"
      fill="none"/>

</g>

<g class="backA">
<rect x="50" y="155" width="10" height="56" rx="3" fill="#e5b957"/>
<rect x="48" y="209" width="14" height="8" fill="#6b3f18"/>
</g>

<g class="backB">
<rect x="70" y="155" width="10" height="56" rx="3" fill="#e5b957"/>
<rect x="68" y="209" width="14" height="8" fill="#6b3f18"/>
</g>

<g class="frontB">
<rect x="95" y="155" width="10" height="56" rx="3" fill="#e5b957"/>
<rect x="93" y="209" width="14" height="8" fill="#6b3f18"/>
</g>

<g class="frontA">
<rect x="115" y="155" width="10" height="56" rx="3" fill="#e5b957"/>
<rect x="113" y="209" width="14" height="8" fill="#6b3f18"/>
</g>

<g id="tail">
<line x1="122" y1="120"
      x2="147" y2="141"
      stroke="#6b3f18"
      stroke-width="3"/>
<circle cx="147" cy="141" r="4"
        fill="#6b3f18"/>
</g>

</g>

</svg>
