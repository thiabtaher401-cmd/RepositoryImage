<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">

  <title>معلّمة ودودة تلوّح بيدها</title>
  <desc>شخصية معلّمة كرتونية بسيطة، محتواة بالكامل داخل إطار مربّع متوازن، بأنيميشن CSS لطيف (تلويح باليد اليمنى + حركة تنفّس خفيفة للجسم)، بدون أي خلفية أو عناصر خارجية.</desc>

  <style>
    /* ===== حركة تنفّس خفيفة لكامل الجسم ===== */
    #characterPlacement {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: teacherBreathe 3.2s ease-in-out infinite;
    }
    @keyframes teacherBreathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-3px) scale(1.01); }
    }

    /* ===== تلويح باليد اليمنى (يد الشخصية، تظهر يسار الشاشة للمشاهد) ===== */
    #waveArm {
      transform-box: fill-box;
      transform-origin: 50% 5%;   /* الكتف هو محور الدوران */
      animation: teacherWave 1.6s ease-in-out infinite;
    }
    @keyframes teacherWave {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(-18deg); }
      50%      { transform: rotate(4deg); }
      75%      { transform: rotate(-14deg); }
    }

    /* ===== رمشة عين خفيفة بين حين وآخر ===== */
    #eyes {
      animation: teacherBlink 4.5s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes teacherBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(0.1); }
    }
  </style>

  <!-- ⭐ كل محتوى الشخصية المرئي داخل هذه المجموعة فقط —
       لا خلفية، لا سماء، لا أشجار — الشخصية معزولة تمامًا -->
  <g id="characterPlacement">

    <!-- ===== ظلّ خفيف تحت القدمين ===== -->
    <ellipse cx="200" cy="378" rx="70" ry="12" fill="#000000" opacity="0.12"/>

    <!-- ===== الساقان ===== -->
    <rect x="168" y="300" width="24" height="75" rx="10" fill="#2f3b52"/>
    <rect x="208" y="300" width="24" height="75" rx="10" fill="#2f3b52"/>
    <!-- الحذاء -->
    <ellipse cx="180" cy="378" rx="20" ry="10" fill="#1c2333"/>
    <ellipse cx="220" cy="378" rx="20" ry="10" fill="#1c2333"/>

    <!-- ===== الجسم / الفستان ===== -->
    <path d="M 140 195
             Q 200 175 260 195
             L 275 320
             Q 200 345 125 320
             Z"
          fill="#3b6fd6"/>
    <!-- حزام بسيط -->
    <rect x="150" y="255" width="100" height="14" rx="7" fill="#274a99"/>
    <!-- ياقة بيضاء -->
    <path d="M 170 195 Q 200 210 230 195 L 222 178 Q 200 190 178 178 Z" fill="#ffffff"/>

    <!-- ===== الذراع اليسرى (ثابتة، ممسكة بكتاب) ===== -->
    <g>
      <path d="M 148 205 Q 108 225 100 275" stroke="#3b6fd6" stroke-width="26"
            stroke-linecap="round" fill="none"/>
      <!-- يد -->
      <circle cx="98" cy="280" r="15" fill="#f2c39c"/>
      <!-- كتاب صغير -->
      <rect x="70" y="270" width="42" height="30" rx="3" fill="#e0a94c" stroke="#a9752b" stroke-width="2"/>
      <line x1="91" y1="270" x2="91" y2="300" stroke="#a9752b" stroke-width="2"/>
    </g>

    <!-- ===== الذراع اليمنى (المتحرّكة/تلوّح) ===== -->
    <g id="waveArm">
      <path d="M 252 205 Q 300 190 310 140" stroke="#3b6fd6" stroke-width="26"
            stroke-linecap="round" fill="none"/>
      <!-- يد ملوّحة -->
      <circle cx="312" cy="132" r="16" fill="#f2c39c"/>
    </g>

    <!-- ===== الرقبة ===== -->
    <rect x="188" y="150" width="24" height="30" fill="#f2c39c"/>

    <!-- ===== الرأس ===== -->
    <circle cx="200" cy="115" r="58" fill="#f6d3ac"/>

    <!-- شعر -->
    <path d="M 142 105
             Q 138 45 200 40
             Q 262 45 258 105
             Q 250 70 200 68
             Q 150 70 142 105 Z"
          fill="#5a3a2a"/>
    <path d="M 142 108 Q 132 150 148 170 Q 140 130 150 108 Z" fill="#5a3a2a"/>
    <path d="M 258 108 Q 268 150 252 170 Q 260 130 250 108 Z" fill="#5a3a2a"/>

    <!-- ===== العينان (مع الرمشة) ===== -->
    <g id="eyes">
      <ellipse cx="180" cy="118" rx="7" ry="9" fill="#2a2a2a"/>
      <ellipse cx="220" cy="118" rx="7" ry="9" fill="#2a2a2a"/>
      <circle cx="182.5" cy="115" r="2" fill="#ffffff"/>
      <circle cx="222.5" cy="115" r="2" fill="#ffffff"/>
    </g>

    <!-- حواجب ودودة -->
    <path d="M 168 100 Q 180 94 192 99" stroke="#5a3a2a" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 208 99 Q 220 94 232 100" stroke="#5a3a2a" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- خدود وردية -->
    <ellipse cx="168" cy="138" rx="10" ry="6" fill="#f39a9a" opacity="0.55"/>
    <ellipse cx="232" cy="138" rx="10" ry="6" fill="#f39a9a" opacity="0.55"/>

    <!-- ابتسامة -->
    <path d="M 178 142 Q 200 160 222 142" stroke="#8a4a3a" stroke-width="4"
          stroke-linecap="round" fill="none"/>

  </g>

</svg>
